services:
  - type: web
    name: aids-department-backend
    env: node
    buildCommand: npm install
    startCommand: node --import tsx/esm server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "departmentai&ds@gmail.com"
      - key: FRONTEND_URL
        value: "https://aids-department-portal.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
